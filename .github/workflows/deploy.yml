name: Build & Deploy

on:
  push:
    branches: [master]
  # Pull requests build and validate but never deploy, so a broken change is caught
  # on the PR rather than after it has already replaced the live site.
  pull_request:
    branches: [master]
  workflow_dispatch:

# Allow one concurrent deployment, letting in-progress runs finish so a deploy is
# never left half-applied.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      index-sha256: ${{ steps.fingerprint.outputs.index-sha256 }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke test the built site
        run: npm run test:e2e

      # Traces for each failing test, viewable with `npx playwright show-report`.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # Identifies exactly what gets uploaded, so it runs after the smoke tests, which
      # rebuild dist/. index.html names every hashed JS and CSS file, so its hash changes
      # whenever any of them do. Runs on pull requests too, so a broken step fails there
      # rather than at deploy time.
      - id: fingerprint
        name: Fingerprint the build
        run: echo "index-sha256=$(sha256sum dist/index.html | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@v6
        if: github.event_name == 'push'

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push'
        with:
          path: ./dist

  deploy:
    # Only master publishes. A PR run stops after build.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      # deploy-pages succeeding means Pages accepted the artifact, not that visitors get
      # it. This checks from the outside: the live index.html must be byte-identical to the
      # one this run built, so a stale deploy fails instead of passing on the old site.
      # Twenty tries 30s apart outlast the CDN's ten-minute max-age; in practice Pages
      # purges on deploy and the first try passes.
      - name: Check the live site serves this build
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA256: ${{ needs.build.outputs.index-sha256 }}
        run: |
          for attempt in $(seq 1 20); do
            live_sha256=$(curl --fail --silent --show-error "$PAGE_URL" | sha256sum | cut -d ' ' -f 1) \
              || live_sha256="unreachable"

            if [ "$live_sha256" = "$EXPECTED_SHA256" ]; then
              echo "OK $PAGE_URL serves this build ($EXPECTED_SHA256)"
              break
            fi

            if [ "$attempt" -eq 20 ]; then
              echo "::error::$PAGE_URL never served this build: expected $EXPECTED_SHA256, last saw $live_sha256"
              exit 1
            fi

            echo "Attempt $attempt: live page is $live_sha256, waiting for $EXPECTED_SHA256"
            sleep 30
          done

          curl --fail --silent --show-error --output /dev/null \
            --retry 5 --retry-delay 10 --retry-all-errors "${PAGE_URL%/}/og-image.png"
          echo "OK ${PAGE_URL%/}/og-image.png"
