name: Build & Deploy

on:
  push:
    branches: [master]
  # Pull requests build and validate but never deploy, so a broken change is caught
  # on the PR rather than after it has already replaced the live site.
  pull_request:
    branches: [master]
  workflow_dispatch:

# Allow one concurrent deployment, letting in-progress runs finish so a deploy is
# never left half-applied.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke test the built site
        run: npm run test:e2e

      # Traces for each failing test, viewable with `npx playwright show-report`.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - uses: actions/configure-pages@v5
        if: github.event_name == 'push'

      - uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'push'
        with:
          path: ./dist

  deploy:
    # Only master publishes. A PR run stops after build.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
