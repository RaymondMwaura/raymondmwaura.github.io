<!doctype html>
<!--
  Source for public/og-image.png, the 1200x630 card shown when the site is shared on
  LinkedIn, WhatsApp, Slack and the like. Not part of the build. Regenerate after
  changing the copy below, from the repo root:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
      --allow-file-access-from-files --hide-scrollbars --window-size=1200,630 \
      --screenshot=public/og-image.png "file://$PWD/scripts/og-image.html"

  Colours and faces mirror the dark theme in src/index.css.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OG image</title>
    <style>
      @font-face {
        font-family: "Newsreader Variable";
        font-weight: 200 800;
        src: url("../node_modules/@fontsource-variable/newsreader/files/newsreader-latin-wght-normal.woff2")
          format("woff2-variations");
      }

      @font-face {
        font-family: "IBM Plex Sans Variable";
        font-weight: 100 700;
        src: url("../node_modules/@fontsource-variable/ibm-plex-sans/files/ibm-plex-sans-latin-wght-normal.woff2")
          format("woff2-variations");
      }

      @font-face {
        font-family: "IBM Plex Mono";
        font-weight: 500;
        src: url("../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2")
          format("woff2");
      }

      :root {
        --canvas: oklch(0.168 0.011 55);
        --border: oklch(0.315 0.012 55);
        --ink: oklch(0.945 0.008 85);
        --ink-muted: oklch(0.715 0.013 70);
        --accent: oklch(0.775 0.135 48);
      }

      * {
        margin: 0;
        box-sizing: border-box;
      }

      body {
        display: flex;
        flex-direction: column;
        width: 1200px;
        height: 630px;
        padding: 64px 80px 60px;
        background: var(--canvas);
        color: var(--ink);
        font-family: "IBM Plex Sans Variable", sans-serif;
      }

      .label {
        font-family: "IBM Plex Mono", monospace;
        font-weight: 500;
        font-size: 19px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .top {
        display: flex;
        justify-content: space-between;
        color: var(--ink-muted);
      }

      .top strong {
        color: var(--ink);
        font-weight: inherit;
      }

      h1 {
        margin-top: auto;
        font-family: "Newsreader Variable", serif;
        font-weight: 500;
        font-size: 156px;
        line-height: 0.92;
        letter-spacing: -0.022em;
      }

      .bottom {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-top: 44px;
        padding-top: 26px;
        border-top: 1px solid var(--border);
      }

      .focus {
        font-size: 30px;
        line-height: 1.3;
      }

      /* Echoes the hero, where the employer is the one phrase set in the accent. */
      .focus span {
        color: var(--accent);
      }

      .bottom .label {
        color: var(--ink-muted);
      }
    </style>
  </head>
  <body>
    <p class="label top">
      <span><strong>R.Mwaura</strong> / Frontend Engineer</span>
      <span>Nairobi · UTC+3</span>
    </p>

    <h1>Raymond<br />Mwaura</h1>

    <div class="bottom">
      <p class="focus">Payments &amp; billing platforms at <span>Safaricom</span></p>
      <p class="label">raymondmwaura.github.io</p>
    </div>
  </body>
</html>
