    <!--
      Sets the theme before first paint so a dark-mode visitor never sees a white flash.
      Inlined deliberately: an external file would load too late to prevent it.
    -->
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("theme");
          const prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
          const theme = stored ?? (prefersLight ? "light" : "dark");
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch {
          /* localStorage unavailable (private mode) — the dark default already applies. */
        }
      })();
    </script>
